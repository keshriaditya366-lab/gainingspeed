name: Bot Chain

on:
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. SETUP: Finds files and creates the runner groups
  # ─────────────────────────────────────────────────────────────
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_files: ${{ steps.set-matrix.outputs.has_files }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          FILES=( $(ls mainx*.py 2>/dev/null | sort -V) )
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "No files found yet. Waiting..."
            exit 0
          fi

          echo "has_files=true" >> $GITHUB_OUTPUT
          echo "Found ${#FILES[@]} files. Grouping into pairs..."

          # Group files by 2s
          PAIRS=()
          for ((i=0; i<${#FILES[@]}; i+=2)); do
            if [ -n "${FILES[$((i+1))]}" ]; then
              PAIRS+=("${FILES[$i]},${FILES[$((i+1))]}")
            else
              PAIRS+=("${FILES[$i]}")
            fi
          done

          # Convert to JSON array for Matrix
          JSON_ARRAY=$(printf '%s\n' "${PAIRS[@]}" | jq -R . | jq -s .)
          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "Matrix created: $JSON_ARRAY"

  # ─────────────────────────────────────────────────────────────
  # 2. RUN-BOTS: Spawns 1 runner per group
  # ─────────────────────────────────────────────────────────────
  run-bots:
    needs: setup
    if: needs.setup.outputs.has_files == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        files: ${{ fromJSON(needs.setup.outputs.matrix) }}
    concurrency:
      group: bot-runner-${{ matrix.files }}
      cancel-in-progress: true # Kills old runner instantly if new run starts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests psutil python-telegram-bot igrapiweb
          python -m playwright install --with-deps chromium
      - name: Run Files
        env:
          FILES: ${{ matrix.files }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          IFS=',' read -ra FILE_ARR <<< "$FILES"
          echo "📦 This runner is hosting: ${FILE_ARR[*]}"
          
          for f in "${FILE_ARR[@]}"; do
            ( while true; do
                python -u "$f" || true
                echo "⚠️ $f exited. Restarting in 5s..."
                sleep 5
              done ) &
          done
          
          # Keep the job alive
          wait

  # ─────────────────────────────────────────────────────────────
  # 3. WATCHER: Monitors for new files and self-destructs
  # ─────────────────────────────────────────────────────────────
  watcher:
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    concurrency:
      group: bot-watcher
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Watch Repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: "main.yml"
          BRANCH: "main"
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # Create a hash of all current file names
          INITIAL_HASH=$(ls mainx*.py 2>/dev/null | sort -V | md5sum | awk '{print $1}')
          
          RUN_SECONDS=$(shuf -i 18000-20700 -n 1)
          START_TS=$(date +%s)
          echo "⏱ Watcher window: $RUN_SECONDS s ($((RUN_SECONDS/60)) min)"

          while true; do
            sleep 60
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TS))

            # Fetch latest changes from repo
            git pull origin "$BRANCH" --rebase --quiet 2>/dev/null || true
            
            # Check if files changed (added, deleted, or renamed)
            CURRENT_HASH=$(ls mainx*.py 2>/dev/null | sort -V | md5sum | awk '{print $1}')

            if [ "$CURRENT_HASH" != "$INITIAL_HASH" ]; then
              echo "🆕 File change detected! Spawning new workflow..."
              break
            fi

            if [ "$ELAPSED" -ge "$RUN_SECONDS" ]; then
              echo "⏰ Time window expired! Spawning new workflow..."
              break
            fi
          done

          # 1. Dispatch new workflow
          echo "🔄 Dispatching new run..."
          curl -s -o /dev/null -w "Dispatch HTTP: %{http_code}\n" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
            -d "{\"ref\":\"$BRANCH\"}"

          # 2. Kill current workflow (which kills all current run-bots)
          echo "🛑 Cancelling current run ($RUN_ID)..."
          curl -s -o /dev/null -w "Cancel HTTP: %{http_code}\n" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel"
          
          sleep 2
          exit 0
