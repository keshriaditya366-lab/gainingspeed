name: Bot Chain

on:
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. SETUP: Finds files and creates the runner groups
  # ─────────────────────────────────────────────────────────────
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_files: ${{ steps.set-matrix.outputs.has_files }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          FILES=( $(ls mainx*.py 2>/dev/null | sort -V) )
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "No files found yet. Waiting..."
            exit 0
          fi

          echo "has_files=true" >> $GITHUB_OUTPUT
          echo "Found ${#FILES[@]} files. Grouping into pairs..."

          PAIRS=()
          for ((i=0; i<${#FILES[@]}; i+=2)); do
            if [ -n "${FILES[$((i+1))]}" ]; then
              PAIRS+=("${FILES[$i]},${FILES[$((i+1))]}")
            else
              PAIRS+=("${FILES[$i]}")
            fi
          done

          JSON_ARRAY=$(printf '%s\n' "${PAIRS[@]}" | jq -R . | jq -s -c .)
          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "Matrix created: $JSON_ARRAY"

  # ─────────────────────────────────────────────────────────────
  # 2. RUN-BOTS: Spawns 1 runner per group
  # ─────────────────────────────────────────────────────────────
  run-bots:
    needs: setup
    if: needs.setup.outputs.has_files == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        files: ${{ fromJSON(needs.setup.outputs.matrix) }}
    concurrency:
      group: bot-runner-${{ matrix.files }}
      cancel-in-progress: true 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests psutil python-telegram-bot igrapiweb
          python -m playwright install --with-deps chromium
      - name: Run Files
        env:
          FILES: ${{ matrix.files }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          IFS=',' read -ra FILE_ARR <<< "$FILES"
          echo "📦 This runner is hosting: ${FILE_ARR[*]}"
          
          for f in "${FILE_ARR[@]}"; do
            ( while true; do
                python -u "$f" || true
                echo "⚠️ $f exited. Restarting in 5s..."
                sleep 5
              done ) &
          done
          
          wait

  # ─────────────────────────────────────────────────────────────
  # 3. WATCHER: Monitors for new files and Aggressive Kill Loop
  # ─────────────────────────────────────────────────────────────
  watcher:
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    concurrency:
      group: bot-watcher
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Watch Repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: "main.yml"
          BRANCH: "main"
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          INITIAL_HASH=$(ls mainx*.py 2>/dev/null | sort -V | md5sum | awk '{print $1}')
          
          RUN_SECONDS=$(shuf -i 18000-20700 -n 1)
          START_TS=$(date +%s)
          echo "⏱ Watcher window: $RUN_SECONDS s ($((RUN_SECONDS/60)) min)"

          while true; do
            sleep 60
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TS))

            git pull origin "$BRANCH" --rebase --quiet 2>/dev/null || true
            CURRENT_HASH=$(ls mainx*.py 2>/dev/null | sort -V | md5sum | awk '{print $1}')

            if [ "$CURRENT_HASH" != "$INITIAL_HASH" ]; then
              echo "🆕 New file detected! Breaking loop for INSTANT handoff..."
              break
            fi

            if [ "$ELAPSED" -ge "$RUN_SECONDS" ]; then
              echo "⏰ Time window expired! Initiating handoff..."
              break
            fi
          done

          # ─────────────────────────────────────────────────────────────
          # SAFE HANDOFF PROTOCOL (With Aggressive Kill Loop)
          # ─────────────────────────────────────────────────────────────
          echo "🔄 Starting Handoff Protocol..."
          DISPATCH_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          while true; do
            echo "Dispatching new run..."
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
              -d "{\"ref\":\"$BRANCH\"}")

            if [ "$HTTP" != "204" ]; then
              echo "❌ Dispatch failed (HTTP $HTTP). Retrying in 60s..."
              sleep 60
              continue
            fi

            echo "⏳ Dispatch successful. Waiting 15s for GitHub to register the run..."
            sleep 15

            NEW_RUN_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?created=>$DISPATCH_TIME" | \
              jq -r --arg cur "$RUN_ID" '.workflow_runs[] | select(.id|tostring != $cur) | .id' | head -n 1)

            if [ -z "$NEW_RUN_ID" ] || [ "$NEW_RUN_ID" = "null" ]; then
              echo "❌ Could not find the new run. Retrying in 60s..."
              sleep 60
              continue
            fi

            echo "✅ Found new run ID: $NEW_RUN_ID. Waiting 60s to ensure it survives startup..."
            sleep 60

            STATUS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs/$NEW_RUN_ID" | jq -r .status)

            if [ "$STATUS" = "queued" ] || [ "$STATUS" = "in_progress" ]; then
              echo "✅ New run is alive and healthy (Status: $STATUS)."
              
              # ── THE AGGRESSIVE KILL LOOP ──
              echo "🛑 Terminating old workflow run ($RUN_ID)..."
              while true; do
                # Send kill command
                curl -s -o /dev/null -X POST \
                  -H "Authorization: token $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel"
                
                echo "⏳ Kill command sent. Waiting 10s to verify termination..."
                sleep 10
                
                # Check old run status
                OLD_STATUS=$(curl -s -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID" | jq -r .status)
                
                if [ "$OLD_STATUS" = "completed" ] || [ "$OLD_STATUS" = "cancelled" ]; then
                  echo "💀 Old workflow successfully terminated! (Status: $OLD_STATUS)"
                  break
                else
                  echo "⚠️ Old workflow is still $OLD_STATUS! Re-sending kill command..."
                fi
              done
              
              sleep 5
              exit 0
              
            else
              echo "❌ New run died during startup (Status: $STATUS). Retrying in 60s..."
              sleep 60
            fi
          done
